<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="App policies and AdMob app-ads.txt for justinlau99.github.io." />
    <meta name="color-scheme" content="dark" />
    <title>justinlau99.github.io</title>
    <style>
        :root {
            color-scheme: dark;
            --text: #e8e8e8;
            --muted: #aaa;
            --border: #333;
            --bg: #121212;
            --link: #64b5f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
        }

        a {
            color: var(--link);
        }

        main {
            max-width: 36rem;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem;
        }

        p.lead {
            color: var(--muted);
            margin: 0 0 2rem;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            padding: 1rem 1.1rem;
        }

        .app-name {
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .app-name a {
            color: var(--text);
            text-decoration: none;
        }

        .app-name a:hover {
            color: var(--link);
        }

        .app-meta {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <main>
        <h1>justinlau99.github.io</h1>
        <p class="lead">Hosted pages for mobile apps.</p>
        <ul>
            <li>
                <div class="app-name"><a href="/App-Policies/">App policies</a></div>
                <div class="app-meta">Privacy policies, disclaimers, and data deletion for store listings</div>
            </li>
            <li>
                <div class="app-name"><a href="/app-ads.txt">app-ads.txt</a></div>
                <div class="app-meta">AdMob publisher authorization</div>
            </li>
        </ul>
        <p class="footer">Contact: <a href="mailto:justinlau99dev@gmail.com">justinlau99dev@gmail.com</a></p>
    </main>
</body>

</html>
